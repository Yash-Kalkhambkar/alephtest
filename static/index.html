<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stand Allocation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    header {
      background: #1e293b;
      color: #f8fafc;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    header span { font-size: 0.8rem; color: #94a3b8; }

    .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

    /* Metric cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 16px;
      border-left: 4px solid #94a3b8;
    }
    .card.green  { border-color: #22c55e; }
    .card.red    { border-color: #ef4444; }
    .card.blue   { border-color: #3b82f6; }
    .card.amber  { border-color: #f59e0b; }
    .card label  { font-size: 0.72rem; text-transform: uppercase; letter-spacing: .05em; color: #64748b; }
    .card .val   { font-size: 1.7rem; font-weight: 700; margin-top: 4px; }
    .card .sub   { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }

    /* Tabs */
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
    .tab {
      padding: 8px 18px;
      border-radius: 6px 6px 0 0;
      border: none;
      background: #e2e8f0;
      color: #475569;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .tab.active { background: #fff; color: #1e293b; }

    .panel { display: none; }
    .panel.active { display: block; }

    /* Table */
    .table-wrap {
      background: #fff;
      border-radius: 0 8px 8px 8px;
      overflow: auto;
      max-height: 480px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
    th {
      background: #f8fafc;
      padding: 10px 14px;
      text-align: left;
      font-weight: 600;
      color: #475569;
      position: sticky;
      top: 0;
      border-bottom: 1px solid #e2e8f0;
    }
    td { padding: 9px 14px; border-bottom: 1px solid #f1f5f9; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .badge.plb      { background: #dbeafe; color: #1d4ed8; }
    .badge.remote   { background: #fef9c3; color: #92400e; }
    .badge.assigned { background: #dcfce7; color: #166534; }
    .badge.unassigned { background: #fee2e2; color: #991b1b; }
    .badge.s { background: #f1f5f9; color: #475569; }
    .badge.m { background: #ede9fe; color: #5b21b6; }
    .badge.l { background: #fce7f3; color: #9d174d; }

    /* Search/filter bar */
    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .toolbar input, .toolbar select {
      padding: 7px 11px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 0.83rem;
      background: #fff;
      color: #1e293b;
    }
    .toolbar input { width: 220px; }

    /* Loading / error */
    #loading { text-align: center; padding: 48px; color: #94a3b8; font-size: 0.9rem; }
    #error   { text-align: center; padding: 48px; color: #ef4444; font-size: 0.9rem; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>✈ Stand Allocation</h1>
    <span id="window-label">loading…</span>
  </div>
</header>

<div class="container">

  <!-- Metric cards -->
  <div class="cards">
    <div class="card blue">
      <label>Total flights</label>
      <div class="val" id="c-total">—</div>
    </div>
    <div class="card green">
      <label>Assigned</label>
      <div class="val" id="c-assigned">—</div>
    </div>
    <div class="card red">
      <label>Unassigned</label>
      <div class="val" id="c-unassigned">—</div>
      <div class="sub" id="c-unassigned-rate"></div>
    </div>
    <div class="card blue">
      <label>PLB rate</label>
      <div class="val" id="c-plb">—</div>
      <div class="sub">of assigned</div>
    </div>
    <div class="card amber">
      <label>Peak on ground</label>
      <div class="val" id="c-peak">—</div>
      <div class="sub" id="c-peak-time"></div>
    </div>
    <div class="card amber">
      <label>Data issues</label>
      <div class="val" id="c-issues">—</div>
      <div class="sub" id="c-issues-sub"></div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="showTab('allocations')">Allocations</button>
    <button class="tab" onclick="showTab('stands')">Stands</button>
    <button class="tab" onclick="showTab('issues')">Data Issues</button>
  </div>

  <!-- Allocations panel -->
  <div id="tab-allocations" class="panel active">
    <div class="toolbar">
      <input id="alloc-search" placeholder="Search flight ID…" oninput="renderAllocations()">
      <select id="alloc-status" onchange="renderAllocations()">
        <option value="">All statuses</option>
        <option value="ASSIGNED">Assigned</option>
        <option value="UNASSIGNED">Unassigned</option>
      </select>
      <select id="alloc-type" onchange="renderAllocations()">
        <option value="">All types</option>
        <option value="PLB">PLB</option>
        <option value="REMOTE">REMOTE</option>
      </select>
      <select id="alloc-size" onchange="renderAllocations()">
        <option value="">All sizes</option>
        <option value="S">S</option>
        <option value="M">M</option>
        <option value="L">L</option>
      </select>
    </div>
    <div id="loading">Loading…</div>
    <div class="table-wrap" id="alloc-table-wrap" style="display:none">
      <table>
        <thead>
          <tr>
            <th>Flight</th>
            <th>Size</th>
            <th>Arrival</th>
            <th>Departure</th>
            <th>Status</th>
            <th>Stand</th>
            <th>Type</th>
            <th>Reason</th>
          </tr>
        </thead>
        <tbody id="alloc-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Stands panel -->
  <div id="tab-stands" class="panel">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Stand</th>
            <th>Type</th>
            <th>Max size</th>
            <th>Flights</th>
            <th>Utilisation</th>
            <th>Occupied min</th>
          </tr>
        </thead>
        <tbody id="stands-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Issues panel -->
  <div id="tab-issues" class="panel">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>File</th>
            <th>Row</th>
            <th>Record</th>
            <th>Code</th>
            <th>Action</th>
            <th>Field</th>
            <th>Original value</th>
            <th>Message</th>
          </tr>
        </thead>
        <tbody id="issues-body"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const BASE = 'http://127.0.0.1:8000';
  let allocData = [];

  function fmt(iso) {
    return iso ? iso.replace('T', ' ').replace('Z', '') : '—';
  }
  function fmtTime(iso) {
    return iso ? iso.slice(11, 16) : '—';
  }
  function pct(n) {
    return (n * 100).toFixed(1) + '%';
  }

  function showTab(name) {
    document.querySelectorAll('.tab').forEach((t, i) => {
      const names = ['allocations', 'stands', 'issues'];
      t.classList.toggle('active', names[i] === name);
    });
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
  }

  async function load() {
    try {
      const [alloc, metrics, issues] = await Promise.all([
        fetch(BASE + '/allocations').then(r => r.json()),
        fetch(BASE + '/metrics').then(r => r.json()),
        fetch(BASE + '/data-issues').then(r => r.json()),
      ]);

      // Header
      document.getElementById('window-label').textContent =
        fmtTime(alloc.planning_window.start) + '–' +
        fmtTime(alloc.planning_window.end) + ' UTC · ' +
        alloc.planning_window.start.slice(0, 10) +
        ' · buffer ' + alloc.turnaround_buffer_minutes + ' min';

      // Cards
      const s = metrics.assignment_summary;
      const p = metrics.plb_usage;
      const pk = metrics.peak_concurrency;
      document.getElementById('c-total').textContent     = s.total_valid_flights;
      document.getElementById('c-assigned').textContent  = s.assigned;
      document.getElementById('c-unassigned').textContent = s.unassigned;
      document.getElementById('c-unassigned-rate').textContent = pct(s.unassigned_rate) + ' unassigned';
      document.getElementById('c-plb').textContent       = pct(p.plb_rate_of_assigned);
      document.getElementById('c-peak').textContent      = pk.aircraft_on_ground;
      document.getElementById('c-peak-time').textContent = 'at ' + fmtTime(pk.first_occurred_at);
      document.getElementById('c-issues').textContent    = issues.summary.total_issues;
      document.getElementById('c-issues-sub').textContent =
        issues.summary.flights.dropped + ' dropped · ' +
        issues.summary.flights.fixed + ' fixed';

      // Allocations table
      allocData = alloc.allocations;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('alloc-table-wrap').style.display = '';
      renderAllocations();

      // Stands table
      const standsBody = document.getElementById('stands-body');
      const utilByStand = {};
      metrics.stand_utilisation.by_stand.forEach(s => utilByStand[s.stand_id] = s);
      
      // Fetch each stand's flight count via metrics data
      standsBody.innerHTML = metrics.stand_utilisation.by_stand.map(st => {
        const bar = Math.round(st.utilisation * 60);
        return `<tr>
          <td><strong>${st.stand_id}</strong></td>
          <td><span class="badge ${st.stand_type.toLowerCase()}">${st.stand_type}</span></td>
          <td>—</td>
          <td>${st.flight_count}</td>
          <td>
            <div style="display:flex;align-items:center;gap:8px">
              <div style="background:#e2e8f0;border-radius:4px;width:60px;height:8px;overflow:hidden">
                <div style="background:${st.stand_type==='PLB'?'#3b82f6':'#f59e0b'};width:${bar}px;height:8px"></div>
              </div>
              ${pct(st.utilisation)}
            </div>
          </td>
          <td>${st.occupied_minutes}</td>
        </tr>`;
      }).join('');

      // Issues table
      const issuesBody = document.getElementById('issues-body');
      issuesBody.innerHTML = issues.issues.map(i => `<tr>
        <td>${i.source_file}</td>
        <td>${i.row_number}</td>
        <td>${i.record_id || '—'}</td>
        <td style="font-family:monospace;font-size:0.78rem">${i.issue_code}</td>
        <td><span class="badge ${i.action === 'DROPPED' ? 'unassigned' : 'assigned'}">${i.action}</span></td>
        <td>${i.field || '—'}</td>
        <td style="font-family:monospace;font-size:0.78rem;color:#64748b">${i.original_value || '—'}</td>
        <td style="color:#475569">${i.message}</td>
      </tr>`).join('');

    } catch (e) {
      document.getElementById('loading').innerHTML =
        `<div id="error">Could not reach API at ${BASE}.<br>Make sure <code>uvicorn stand_allocation.api:app</code> is running.</div>`;
    }
  }

  function renderAllocations() {
    const search = document.getElementById('alloc-search').value.trim().toUpperCase();
    const status = document.getElementById('alloc-status').value;
    const type   = document.getElementById('alloc-type').value;
    const size   = document.getElementById('alloc-size').value;

    const rows = allocData.filter(a =>
      (!search || a.flight_id.includes(search)) &&
      (!status || a.status === status) &&
      (!type   || a.stand_type === type) &&
      (!size   || a.aircraft_size === size)
    );

    document.getElementById('alloc-body').innerHTML = rows.map(a => `<tr>
      <td><strong>${a.flight_id}</strong></td>
      <td><span class="badge ${a.aircraft_size.toLowerCase()}">${a.aircraft_size}</span></td>
      <td>${fmtTime(a.arrival_time)}</td>
      <td>${fmtTime(a.departure_time)}</td>
      <td><span class="badge ${a.status.toLowerCase()}">${a.status}</span></td>
      <td>${a.stand_id || '—'}</td>
      <td>${a.stand_type ? `<span class="badge ${a.stand_type.toLowerCase()}">${a.stand_type}</span>` : '—'}</td>
      <td style="color:#64748b;font-size:0.78rem">${a.unassigned_reason || ''}</td>
    </tr>`).join('');
  }

  load();
</script>

</body>
</html>
